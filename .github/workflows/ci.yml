name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install ruff pytest pytest-cov mypy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ruff check
        run: python -m ruff check .

      - name: Checagem estatica de tipos (modules)
        run: python -m mypy modules --ignore-missing-imports

      - name: Run tests with coverage
        run: python -m pytest -q --cov=modules --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
